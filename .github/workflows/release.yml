name: Release
on:
  push:
    tags: ['*.*.*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run lint && npm test && npm run build
      - name: Check tag
        run: node -e "if(require('./manifest.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --verify-tag --title "Doom in a Tab $GITHUB_REF_NAME" --generate-notes
